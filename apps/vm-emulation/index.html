<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VM Emulation</title><style>
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#101113;color:#e8eaed;font:13px Arial,sans-serif;overflow:hidden}body{display:grid;grid-template-rows:42px 1fr}.bar{display:flex;align-items:center;gap:8px;padding:0 10px;background:#202124;border-bottom:1px solid #3c4043}.bar button{height:28px;border:0;border-radius:14px;padding:0 12px;background:#303134;color:#e8eaed}.bar button.sel{background:#8ab4f8;color:#10284f;font-weight:700}iframe{width:100%;height:100%;border:0;background:#000}</style></head><body>
<div class="bar"><button class="sel" data-src="qemu/qemu-wasm-demo/alpine-x86_64.html">Alpine x86_64</button><button data-src="qemu/qemu-wasm-demo/raspi3ap.html">Raspberry Pi</button></div><iframe id="vm" src="qemu/qemu-wasm-demo/alpine-x86_64.html" allow="fullscreen; clipboard-read; clipboard-write"></iframe>
<script>document.querySelectorAll('[data-src]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-src]').forEach(x=>x.classList.toggle('sel',x===b));document.getElementById('vm').src=b.dataset.src})</script>
</body></html>
