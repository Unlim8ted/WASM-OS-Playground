<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Canvas</title><style>
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:#202124;font:13px Arial}.bar{height:52px;background:#292a2d;color:#e8eaed;display:flex;align-items:center;gap:10px;padding:0 13px;border-bottom:1px solid #3c4043}.bar b{margin-right:8px}.bar button,.bar select{height:32px;border:1px solid #4b4d50;border-radius:16px;background:#35363a;color:#e8eaed;padding:0 12px}.bar input[type=color]{width:34px;height:34px;border:0;background:transparent;padding:2px}.wrap{position:absolute;inset:52px 0 0;background:#5f6368;display:grid;place-items:center;overflow:hidden}canvas{background:#fff;box-shadow:0 3px 18px #0007;touch-action:none;max-width:100%;max-height:100%}</style></head><body><div class="bar"><b>Canvas</b><input id="color" type="color" value="#202124"><select id="size"><option value="2">2 px</option><option value="4" selected>4 px</option><option value="8">8 px</option><option value="16">16 px</option></select><button id="undo">Undo</button><button id="clear">Clear</button><button id="save">Save PNG</button></div><div class="wrap"><canvas id="c"></canvas></div><script>
const c=document.getElementById('c'),x=c.getContext('2d',{alpha:false});let down=false,last=null,history=[];function fit(){let w=Math.max(640,Math.floor(innerWidth-30)),h=Math.max(420,Math.floor(innerHeight-82));let old=document.createElement('canvas');old.width=c.width;old.height=c.height;old.getContext('2d').drawImage(c,0,0);c.width=w;c.height=h;x.fillStyle='white';x.fillRect(0,0,w,h);if(old.width)x.drawImage(old,0,0)}fit();addEventListener('resize',fit);function snap(){try{history.push(c.toDataURL());if(history.length>12)history.shift()}catch{}}function pt(e){let r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]}c.onpointerdown=e=>{snap();down=true;c.setPointerCapture(e.pointerId);last=pt(e)};c.onpointermove=e=>{if(!down)return;let p=pt(e);x.strokeStyle=color.value;x.lineWidth=+size.value;x.lineCap='round';x.lineJoin='round';x.beginPath();x.moveTo(...last);x.lineTo(...p);x.stroke();last=p};c.onpointerup=c.onpointercancel=()=>{down=false;last=null};undo.onclick=()=>{let u=history.pop();if(!u)return;let im=new Image;im.onload=()=>{x.fillStyle='white';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0)};im.src=u};clear.onclick=()=>{snap();x.fillStyle='white';x.fillRect(0,0,c.width,c.height)};save.onclick=()=>{let a=document.createElement('a');a.download='canvas.png';a.href=c.toDataURL('image/png');a.click()};
<\/script></body></html>
