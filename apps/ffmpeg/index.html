<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FFmpeg</title><style>
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#17181a;color:#e8eaed;font:13px Arial,sans-serif}body{display:grid;grid-template-rows:52px 1fr}.bar{display:flex;align-items:center;gap:10px;padding:0 14px;background:#202124;border-bottom:1px solid #3c4043}.bar b{font-size:15px}.bar span{color:#9aa0a6}.run,.pick,.download{height:32px;border:0;border-radius:16px;padding:0 14px;background:#8ab4f8;color:#10284f;font-weight:700}.run:disabled,.download:disabled{opacity:.55}.osfile{height:32px;min-width:220px;border:1px solid #3c4043;border-radius:16px;background:#17181a;color:#e8eaed;padding:0 10px}.main{display:grid;grid-template-columns:280px 1fr;min-height:0}.files{border-right:1px solid #3c4043;background:#202124;padding:14px;overflow:auto}.files h2,.work h2{font-size:13px;margin:0 0 12px;color:#bdc1c6}.file{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #303134}.file small{color:#9aa0a6}.work{display:grid;grid-template-rows:auto 1fr auto;gap:12px;padding:14px;min-width:0}.args{width:100%;min-height:88px;resize:vertical;border:1px solid #3c4043;border-radius:8px;background:#202124;color:#e8eaed;padding:10px;font:13px/1.45 ui-monospace,Consolas,monospace}.out{margin:0;overflow:auto;white-space:pre-wrap;background:#101113;border:1px solid #303134;border-radius:8px;padding:12px;font:12px/1.45 ui-monospace,Consolas,monospace}.actions{display:flex;gap:8px;align-items:center}.spacer{flex:1}</style></head><body>
<div class="bar"><b>FFmpeg</b><span id="state">Choose a media file, then run a command.</span><select id="osfiles" class="osfile"></select><button class="pick" id="pick">Add file</button><button class="run" id="load" disabled>Loading...</button></div>
<div class="main"><aside class="files"><h2>Files</h2><div id="files"></div></aside><section class="work"><div><h2>Arguments</h2><textarea id="args" class="args">["-i","input","output.mp4"]</textarea></div><pre id="out" class="out">FFmpeg is not loaded.</pre><div class="actions"><button class="run" id="run" disabled>Run</button><span class="spacer"></span><select id="outputs"></select><button class="download" id="download" disabled>Download</button></div></section></div>
<script src="vendor/ffmpeg.js"></script><script src="vendor/ffmpeg-util.js"></script><script>
const {FFmpeg}=FFmpegWASM,{fetchFile,toBlobURL}=FFmpegUtil;
const ffmpeg=new FFmpeg(), files=new Map(), outputs=document.getElementById('outputs'), out=document.getElementById('out'), state=document.getElementById('state'), osfiles=document.getElementById('osfiles'), argsEl=document.getElementById('args'), runBtn=document.getElementById('run'), loadBtn=document.getElementById('load'), downloadBtn=document.getElementById('download');
let loaded=false;
let seq=0,pending=new Map();
addEventListener('message',e=>{let d=e.data||{},p=pending.get(d.id);if(p){pending.delete(d.id);d.ok?p.resolve(d):p.reject(Error(d.error||'OS file request failed'))}});
function osReq(type,payload={}){let id='ffmpeg-'+(++seq);parent.postMessage({id,type,...payload},'*');return new Promise((resolve,reject)=>{pending.set(id,{resolve,reject});setTimeout(()=>{if(pending.delete(id))reject(Error('OS file request timed out'))},15000)})}
function log(s){out.textContent+=(out.textContent?'\n':'')+s;out.scrollTop=out.scrollHeight}
function refresh(){document.getElementById('files').innerHTML=[...files].map(([n,f])=>`<div class="file"><span>${n}<br><small>${(f.size/1048576).toFixed(2)} MB</small></span></div>`).join('')||'<small>No files loaded.</small>';outputs.innerHTML=[...files.keys()].map(n=>`<option>${n}</option>`).join('')}
async function loadOsFiles(){try{let r=await osReq('unlim8ted-code-list',{path:'/home/user'});let items=r.items.filter(x=>!x.dir);osfiles.innerHTML=items.map(x=>`<option value="${x.path}">${x.name}</option>`).join('')||'<option value="">No files in My files</option>'}catch(e){osfiles.innerHTML='<option value="">File list unavailable</option>';log(String(e.message||e))}}
document.getElementById('pick').onclick=async()=>{let path=osfiles.value;if(!path)return;try{let r=await osReq('unlim8ted-code-read',{path});let name=path.split('/').pop()||'input';let bytes=r.bytes instanceof Uint8Array?r.bytes:new Uint8Array(r.bytes||[]);let f=new File([bytes],name);files.set(name,f);if(files.size===1)argsEl.value=JSON.stringify(["-i",name,"output.mp4"]);refresh()}catch(e){log(String(e.message||e))}};
async function loadEngine(){try{state.textContent='Loading runtime...';out.textContent='';const base='vendor';ffmpeg.on('log',({message})=>log(message));await ffmpeg.load({coreURL:await toBlobURL(`${base}/ffmpeg-core.js`,'text/javascript'),wasmURL:await toBlobURL(`${base}/ffmpeg-core.wasm`,'application/wasm')});loaded=true;runBtn.disabled=false;loadBtn.textContent='Loaded';state.textContent='Engine loaded.';log('Ready.')}catch(e){loadBtn.textContent='Load failed';state.textContent='Load failed';log(String(e.stack||e))}}
runBtn.onclick=async()=>{if(!loaded)return;try{runBtn.disabled=true;out.textContent='';for(const [n,f] of files)await ffmpeg.writeFile(n,await fetchFile(f));let argv=JSON.parse(argsEl.value);await ffmpeg.exec(argv);let output=argv[argv.length-1];let data=await ffmpeg.readFile(output);let blob=new Blob([data.buffer]);let file=new File([blob],output);files.set(output,file);await osReq('unlim8ted-code-write',{path:'/home/user/'+output,bytes:data});refresh();outputs.value=output;downloadBtn.disabled=false;log(`Wrote ${output} to My files`)}catch(e){log(String(e.stack||e))}finally{runBtn.disabled=false}};
downloadBtn.onclick=async()=>{let name=outputs.value;if(!name)return;let f=files.get(name);let u=URL.createObjectURL(f),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
refresh();
loadOsFiles();
loadEngine();
</script></body></html>
