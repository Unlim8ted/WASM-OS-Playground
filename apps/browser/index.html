<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Unlim8ted Browser</title>
<style>
            :root {
                --shelf-h: 56px;
                --blue: #8ab4f8;
                --blue2: #a8c7fa;
                --ink: #e8eaed;
                --muted: #9aa0a6;
                --bg: #111315;
                --surface: #202124;
                --surface2: #292a2d;
                --surface3: #303134;
                --surface4: #3c4043;
                --line: #3c4043;
                --hover: #ffffff12;
                --pressed: #ffffff1e;
                --shadow: 0 16px 48px #0008;
                color-scheme: dark;
                font-family: Roboto, "Noto Sans", Arial, sans-serif;
            }

            :root[data-theme="light"] {
                --ink: #202124;
                --muted: #5f6368;
                --bg: #f8f9fa;
                --surface: #fff;
                --surface2: #f1f3f4;
                --surface3: #e8eaed;
                --surface4: #dadce0;
                --line: #dadce0;
                --hover: #0000000a;
                --pressed: #00000014;
                --shadow: 0 16px 48px #0003;
                color-scheme: light;
            }

            * {
                box-sizing: border-box;
            }

            html,
            body {
                margin: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: #111315;
                color: var(--ink);
                font-size: 14px;
                -webkit-font-smoothing: antialiased;
            }

            button,
            input {
                font: inherit;
                color: inherit;
            }

            button {
                border: 0;
                background: none;
                padding: 0;
            }

            .desktop {
                position: fixed;
                inset: 0;
                overflow: hidden;
                user-select: none;
                background: #101215;
            }

            .wallpaper {
                position: absolute;
                inset: 0 0 var(--shelf-h);
                background: radial-gradient(58% 70% at 75% 42%, #2554b9 0 24%, transparent 25%),
                    radial-gradient(54% 68% at 72% 40%, #172968 0 35%, transparent 36%),
                    radial-gradient(45% 66% at 41% 36%, #663448 0 28%, transparent 29%),
                    radial-gradient(60% 80% at 48% 65%, #151b37 0 54%, #0f1117 76%);
                background-color: #101217;
                transition:
                    0.2s filter,
                    0.2s background;
            }

            :root[data-theme="light"] .wallpaper {
                filter: brightness(1.55) saturate(0.9);
            }

            .wallpaper::after {
                content: "";
                position: absolute;
                inset: 0;
                background: linear-gradient(180deg, #0001, #0000 45%, #0004);
            }

            /* ChromeOS shelf */
            .shelfbar {
                position: absolute;
                left: 0;
                right: 0;
                bottom: 0;
                height: var(--shelf-h);
                z-index: 950;
                background: color-mix(in srgb, var(--surface) 72%, transparent);
                backdrop-filter: blur(22px) saturate(135%);
                -webkit-backdrop-filter: blur(22px) saturate(135%);
                border-top: 1px solid #ffffff0b;
                display: grid;
                grid-template-columns: 180px 1fr 270px;
                align-items: center;
                padding: 0 8px;
            }

            .shelf-left {
                display: flex;
                align-items: center;
                gap: 4px;
            }

            .launcher-btn {
                width: 42px;
                height: 42px;
                border-radius: 50%;
                display: grid;
                place-items: center;
                cursor: pointer;
            }

            .launcher-btn:hover {
                background: var(--hover);
            }

            .launcher-mark {
                width: 22px;
                height: 22px;
                border-radius: 50%;
                background: #f1f3f4;
                box-shadow: inset 0 0 0 6px #c6c9ce;
            }

            .shelf-center {
                display: flex;
                justify-content: center;
                align-items: center;
                gap: 5px;
                min-width: 0;
            }

            .shelf-app {
                position: relative;
                width: 44px;
                height: 44px;
                border-radius: 14px;
                display: grid;
                place-items: center;
                cursor: pointer;
                transition:
                    0.12s background,
                    0.12s transform;
            }

            .shelf-app:hover {
                background: var(--hover);
            }

            .shelf-app:active {
                transform: scale(0.94);
            }

            .shelf-app.running::after {
                content: "";
                position: absolute;
                bottom: 1px;
                width: 4px;
                height: 4px;
                border-radius: 50%;
                background: var(--blue2);
            }

            .shelf-app.active {
                background: #ffffff1a;
            }

            .shelf-tray {
                justify-self: end;
                height: 40px;
                min-width: 210px;
                border-radius: 20px;
                padding: 0 14px;
                display: flex;
                align-items: center;
                justify-content: flex-end;
                gap: 9px;
                cursor: pointer;
            }

            .shelf-tray:hover,
            .shelf-tray.open {
                background: var(--hover);
            }

            .tray-date {
                font-size: 12px;
                line-height: 15px;
                text-align: right;
                font-weight: 500;
                min-width: 70px;
            }

            .tray-icon {
                width: 18px;
                height: 18px;
                display: grid;
                place-items: center;
                color: var(--ink);
                opacity: 0.95;
            }

            .battery {
                font-size: 12px;
                font-weight: 500;
                min-width: 28px;
            }

            /* reusable icons */
            .app-icon {
                width: 34px;
                height: 34px;
                position: relative;
                display: grid;
                place-items: center;
                flex: 0 0 auto;
            }

            .app-icon.chrome {
                border-radius: 50%;
                background: conic-gradient(#ea4335 0 33.33%, #fbbc04 0 66.66%, #34a853 0);
            }

            .app-icon.chrome::before {
                content: "";
                width: 15px;
                height: 15px;
                border-radius: 50%;
                background: #4285f4;
                border: 3px solid #e8f0fe;
                box-sizing: border-box;
            }

            .app-icon.files::before {
                content: "";
                width: 31px;
                height: 23px;
                border-radius: 4px;
                background: #5f9cf6;
                box-shadow: inset 0 -7px #7fb0fa;
            }

            .app-icon.files::after {
                content: "";
                position: absolute;
                left: 2px;
                top: 4px;
                width: 14px;
                height: 7px;
                border-radius: 4px 4px 0 0;
                background: #8ab4f8;
            }

            .app-icon.terminal {
                border-radius: 50%;
                background: #39424e;
                color: #fff;
                font:
                    700 15px/1 ui-monospace,
                    monospace;
            }

            .app-icon.terminal::before {
                content: ">_";
            }

            .app-icon.store {
                border-radius: 8px;
                background: #fff;
            }

            .app-icon.store::before {
                content: "";
                width: 0;
                height: 0;
                border-left: 10px solid #34a853;
                border-top: 7px solid transparent;
                border-bottom: 7px solid transparent;
                filter: drop-shadow(-5px 0 #fbbc04) drop-shadow(5px 0 #4285f4);
            }

            .app-icon.settings {
                border-radius: 50%;
                background: #5f6368;
                color: white;
                font-size: 25px;
            }

            .app-icon.settings::before {
                content: "⚙";
                font-family: Arial, sans-serif;
                line-height: 1;
            }

            .app-icon.notes {
                border-radius: 9px;
                background: #fbbc04;
                color: #202124;
                font-size: 20px;
            }

            .app-icon.notes::before {
                content: "▤";
            }

            .app-icon.canvas {
                border-radius: 9px;
                background: linear-gradient(135deg, #f28b82, #fdd663 35%, #81c995 68%, #8ab4f8);
            }

            /* launcher */
            .launcher {
                position: absolute;
                z-index: 940;
                left: 12px;
                bottom: 68px;
                width: min(610px, calc(100vw - 24px));
                height: min(610px, calc(100vh - 90px));
                border-radius: 26px;
                background: color-mix(in srgb, var(--surface) 94%, transparent);
                box-shadow: var(--shadow);
                border: 1px solid #ffffff10;
                backdrop-filter: blur(28px);
                padding: 22px 24px;
                display: none;
                flex-direction: column;
                overflow: hidden;
            }

            .launcher.open {
                display: flex;
            }

            .launch-search-wrap {
                height: 48px;
                border-radius: 24px;
                background: var(--surface3);
                display: flex;
                align-items: center;
                padding: 0 18px;
                gap: 12px;
                flex: 0 0 auto;
            }

            .launch-search-wrap svg {
                width: 20px;
                height: 20px;
                color: var(--muted);
            }

            .launchsearch {
                border: 0;
                outline: 0;
                background: transparent;
                flex: 1;
                font-size: 15px;
            }

            .launchsearch::placeholder {
                color: var(--muted);
            }

            .launcher-kicker {
                margin: 22px 4px 11px;
                font-size: 13px;
                font-weight: 500;
                color: var(--muted);
            }

            .continue-row {
                display: flex;
                gap: 10px;
            }

            .continue-card {
                flex: 1;
                min-width: 0;
                height: 70px;
                border-radius: 14px;
                background: var(--surface3);
                display: flex;
                align-items: center;
                gap: 11px;
                padding: 10px 13px;
                cursor: pointer;
            }

            .continue-card:hover {
                background: var(--surface4);
            }

            .continue-card b,
            .continue-card span {
                display: block;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .continue-card span {
                font-size: 12px;
                color: var(--muted);
                margin-top: 3px;
            }

            .appgrid {
                display: grid;
                grid-template-columns: repeat(5, 1fr);
                gap: 12px 6px;
                overflow: auto;
                padding: 4px 2px 14px;
            }

            .appbtn {
                height: 88px;
                border-radius: 14px;
                display: flex;
                align-items: center;
                justify-content: center;
                flex-direction: column;
                gap: 8px;
                font-size: 12px;
                cursor: pointer;
                text-align: center;
            }

            .appbtn:hover {
                background: var(--hover);
            }

            .appbtn .app-icon {
                width: 40px;
                height: 40px;
            }

            .appbtn .app-icon.chrome::before {
                width: 18px;
                height: 18px;
            }

            .appbtn .app-icon.files::before {
                width: 36px;
                height: 27px;
            }

            .appbtn .app-icon.settings {
                font-size: 29px;
            }

            /* Quick Settings */
            .quick-panel {
                position: absolute;
                z-index: 945;
                right: 12px;
                bottom: 68px;
                width: 390px;
                max-height: calc(100vh - 84px);
                border-radius: 26px;
                background: color-mix(in srgb, var(--surface) 96%, transparent);
                box-shadow: var(--shadow);
                border: 1px solid #ffffff10;
                backdrop-filter: blur(28px);
                padding: 14px;
                display: none;
                overflow: auto;
            }

            .quick-panel.open {
                display: block;
            }

            .q-head {
                height: 52px;
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 0 4px 8px;
            }

            .avatar {
                width: 34px;
                height: 34px;
                border-radius: 50%;
                background: linear-gradient(135deg, #8ab4f8, #c58af9);
                display: grid;
                place-items: center;
                color: #202124;
                font-weight: 700;
            }

            .signout {
                height: 34px;
                padding: 0 15px;
                border-radius: 17px;
                background: var(--surface3);
                font-size: 12px;
                font-weight: 500;
            }

            .q-round {
                margin-left: auto;
                width: 34px;
                height: 34px;
                border-radius: 50%;
                background: var(--surface3);
                display: grid;
                place-items: center;
                cursor: pointer;
                font-size: 17px;
            }

            .q-round + .q-round {
                margin-left: 0;
            }

            .q-round:hover {
                background: var(--surface4);
            }

            .q-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }

            .q-tile {
                height: 76px;
                border-radius: 16px;
                background: var(--surface3);
                padding: 12px;
                display: flex;
                gap: 11px;
                align-items: center;
                cursor: pointer;
                text-align: left;
            }

            .q-tile.on {
                background: #8ab4f8;
                color: #10284f;
            }

            .q-tile:hover {
                filter: brightness(1.06);
            }

            .q-circle {
                width: 36px;
                height: 36px;
                border-radius: 50%;
                background: #ffffff18;
                display: grid;
                place-items: center;
                font-size: 18px;
            }

            .q-tile.on .q-circle {
                background: #0b57d022;
            }

            .q-copy b,
            .q-copy span {
                display: block;
            }

            .q-copy b {
                font-size: 13px;
            }

            .q-copy span {
                font-size: 11px;
                opacity: 0.75;
                margin-top: 3px;
            }

            .slider-row {
                height: 50px;
                display: grid;
                grid-template-columns: 36px 1fr 28px;
                align-items: center;
                gap: 8px;
                margin-top: 6px;
            }

            .slider-row input {
                accent-color: #8ab4f8;
                width: 100%;
            }

            .q-footer {
                display: flex;
                justify-content: space-between;
                color: var(--muted);
                font-size: 12px;
                border-top: 1px solid var(--line);
                padding: 12px 5px 2px;
                margin-top: 7px;
            }

            /* windows */
            .win {
                position: absolute;
                display: none;
                flex-direction: column;
                min-width: 440px;
                min-height: 300px;
                border-radius: 12px;
                background: var(--surface);
                color: var(--ink);
                box-shadow: 0 18px 70px #000b;
                overflow: hidden;
                resize: both;
                border: 1px solid #ffffff0b;
                z-index: 20;
            }

            .win.open {
                display: flex;
            }

            .win.focused {
                box-shadow: 0 20px 80px #000d;
            }

            .app-titlebar {
                height: 42px;
                flex: 0 0 auto;
                background: var(--surface2);
                display: flex;
                align-items: center;
                padding-left: 14px;
                border-bottom: 1px solid var(--line);
                user-select: none;
            }

            .app-title {
                flex: 1;
                font-size: 13px;
                font-weight: 500;
            }

            .window-controls {
                display: flex;
                height: 100%;
                margin-left: auto;
            }

            .window-controls button {
                width: 46px;
                height: 100%;
                display: grid;
                place-items: center;
                color: var(--ink);
                cursor: pointer;
                font-size: 16px;
            }

            .window-controls button:hover {
                background: var(--hover);
            }

            .window-controls .close:hover {
                background: #c42b1c;
                color: #fff;
            }

            .window-controls .min::before {
                content: "";
                width: 10px;
                border-top: 1px solid currentColor;
            }

            .window-controls .max::before {
                content: "";
                width: 10px;
                height: 8px;
                border: 1px solid currentColor;
            }

            .app-body {
                flex: 1;
                min-height: 0;
                position: relative;
                background: var(--surface);
            }

            /* Chrome browser */
            #browserWin {
                left: 4%;
                top: 3%;
                width: 92%;
                height: 86%;
                min-width: 720px;
            }

            .chrome-frame {
                background: #202124;
            }

            .chrome-tabs {
                height: 44px;
                background: #202124;
                display: flex;
                align-items: flex-end;
                padding: 0 0 0 8px;
                user-select: none;
            }

            .tabs {
                display: flex;
                align-items: flex-end;
                min-width: 0;
                flex: 1;
                height: 100%;
                overflow: hidden;
            }

            .tab {
                position: relative;
                height: 36px;
                min-width: 95px;
                max-width: 240px;
                flex: 1;
                border-radius: 10px 10px 0 0;
                padding: 0 10px;
                display: flex;
                align-items: center;
                gap: 8px;
                color: #bdc1c6;
                font-size: 12px;
                cursor: pointer;
            }

            .tab:hover {
                background: #303134;
            }

            .tab.active {
                background: #35363a;
                color: #e8eaed;
            }

            .tab.active::before,
            .tab.active::after {
                content: "";
                position: absolute;
                bottom: 0;
                width: 10px;
                height: 10px;
                background: #202124;
            }

            .tab.active::before {
                left: -10px;
                border-bottom-right-radius: 10px;
            }

            .tab.active::after {
                right: -10px;
                border-bottom-left-radius: 10px;
            }

            .tab-favicon {
                width: 15px;
                height: 15px;
                border-radius: 50%;
                background: conic-gradient(#ea4335 0 33%, #fbbc04 0 66%, #34a853 0);
                position: relative;
                flex: 0 0 auto;
            }

            .tab-favicon::after {
                content: "";
                position: absolute;
                inset: 4px;
                border-radius: 50%;
                background: #4285f4;
            }

            .tab .txt {
                min-width: 0;
                flex: 1;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .tab-x {
                width: 18px;
                height: 18px;
                border-radius: 50%;
                display: grid;
                place-items: center;
                font-size: 15px;
            }

            .tab-x:hover {
                background: #ffffff20;
            }

            .newtabbtn {
                width: 30px;
                height: 30px;
                border-radius: 50%;
                margin: 0 4px 3px 5px;
                color: #bdc1c6;
                font-size: 20px;
                cursor: pointer;
            }

            .newtabbtn:hover {
                background: #ffffff16;
            }

            .chrome-window-controls {
                height: 44px;
                display: flex;
                align-self: flex-start;
            }

            .chrome-window-controls button {
                width: 46px;
                height: 44px;
                color: #e8eaed;
                display: grid;
                place-items: center;
                cursor: pointer;
            }

            .chrome-window-controls button:hover {
                background: #ffffff16;
            }

            .chrome-window-controls .close:hover {
                background: #c42b1c;
            }

            .chrome-window-controls .min::before {
                content: "";
                width: 10px;
                border-top: 1px solid currentColor;
            }

            .chrome-window-controls .max::before {
                content: "";
                width: 10px;
                height: 8px;
                border: 1px solid currentColor;
            }

            .chrome-toolbar {
                height: 48px;
                background: #35363a;
                display: flex;
                align-items: center;
                gap: 4px;
                padding: 6px 8px;
                border-bottom: 1px solid #2b2c2e;
            }

            .navbtn {
                width: 34px;
                height: 34px;
                border-radius: 50%;
                display: grid;
                place-items: center;
                color: #bdc1c6;
                cursor: pointer;
                font-size: 20px;
            }

            .navbtn:hover {
                background: #ffffff14;
            }

            .navbtn:disabled {
                opacity: 0.35;
            }

            .omnibox-wrap {
                height: 36px;
                border-radius: 18px;
                background: #202124;
                display: flex;
                align-items: center;
                flex: 1;
                min-width: 120px;
                border: 1px solid transparent;
            }

            .omnibox-wrap:focus-within {
                background: #202124;
                border-color: #8ab4f8;
            }

            .site-chip {
                width: 34px;
                height: 34px;
                display: grid;
                place-items: center;
                color: #9aa0a6;
            }

            .omnibox {
                min-width: 0;
                flex: 1;
                height: 100%;
                border: 0;
                outline: 0;
                background: transparent;
                color: #e8eaed;
                font-size: 14px;
            }

            .toolbar-action {
                width: 32px;
                height: 32px;
                border-radius: 50%;
                display: grid;
                place-items: center;
                color: #bdc1c6;
                cursor: pointer;
            }

            .toolbar-action:hover {
                background: #ffffff12;
            }

            .browser-content {
                position: relative;
                flex: 1;
                min-height: 0;
                background: #202124;
                overflow: hidden;
                contain: strict;
            }

            .gecko-canvas {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                display: none;
                background: #fff;
                outline: 0;
                touch-action: none;
                overscroll-behavior: none;
            }

            .newtab {
                position: absolute;
                inset: 0;
                background: #202124;
                color: #e8eaed;
                display: flex;
                align-items: center;
                justify-content: flex-start;
                flex-direction: column;
                padding-top: min(15vh, 120px);
            }

            .newtab-logo {
                font-size: 54px;
                letter-spacing: -2px;
                font-weight: 500;
                margin-bottom: 34px;
            }

            .newtab-logo .u8 {
                color: #8ab4f8;
            }

            .searchbox {
                width: min(580px, 72%);
                height: 46px;
                border-radius: 23px;
                background: #303134;
                display: flex;
                align-items: center;
                padding: 0 18px;
                gap: 13px;
                box-shadow: 0 1px 6px #0007;
            }

            .searchbox:hover {
                background: #3c4043;
            }

            .searchbox input {
                border: 0;
                outline: 0;
                background: transparent;
                color: #e8eaed;
                flex: 1;
                font-size: 15px;
            }

            .shortcuts {
                display: flex;
                gap: 16px;
                margin-top: 28px;
            }

            .shortcut {
                width: 96px;
                height: 96px;
                border-radius: 8px;
                display: flex;
                align-items: center;
                justify-content: center;
                flex-direction: column;
                gap: 9px;
                font-size: 12px;
                cursor: pointer;
            }

            .shortcut:hover {
                background: #ffffff0b;
            }

            .shortcut i {
                width: 48px;
                height: 48px;
                border-radius: 50%;
                background: #303134;
                display: grid;
                place-items: center;
                font-style: normal;
                font-size: 17px;
            }

            .bootstate {
                position: absolute;
                inset: 0;
                background: #202124;
                display: none;
                place-items: center;
                z-index: 5;
            }

            .bootcard {
                width: min(430px, 75%);
                text-align: center;
            }

            .bootcard h2 {
                font-size: 20px;
                font-weight: 500;
                margin: 0 0 18px;
            }

            .progress {
                height: 4px;
                background: #3c4043;
                border-radius: 2px;

            /* Settings */

            /* context + overview */

addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="t"){e.preventDefault();newTab()}if((e.ctrlKey||e.metaKey)&&e.shiftKey&&e.key.toLowerCase()==="d"){e.preventDefault();showDownloads()}if((e.ctrlKey||e.metaKey)&&e.shiftKey&&e.key.toLowerCase()==="o"){e.preventDefault();showBookmarkManager()}});
// Hook successful page loads so enabled content scripts and download interception are reinstalled on each navigation.
const _loadUrl=loadUrl;loadUrl=async function(u){await _loadUrl(u);syncBookmark();await installDownloadBridge();await runExtensions()};
setInterval(()=>{installDownloadBridge();pollDownloadBridge()},700);
window.Unlim8tedBrowser.download=downloadToVFS;window.Unlim8tedBrowser.downloads=()=>shellRPC("unlim8ted-browser-fs-list",{path:"/home/user/Downloads"});window.Unlim8tedBrowser.bookmarks={list:()=>bookmarks.slice(),manager:showBookmarkManager};window.Unlim8tedBrowser.extensions={list:()=>extensions.slice(),install:installExtension,run:runExtensions};

if (!tabs.length) newTab();
scheduleBrowserResize();
</script>
</body>
</html>
