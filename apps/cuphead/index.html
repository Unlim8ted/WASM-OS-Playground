<!DOCTYPE html>
<html lang="en-us">
  <head>
    <base href="https://cdn.jsdelivr.net/gh/web-ports/cuphead@c9ff1b6b16f9d402b78a42fc2200e1c076c0ab6e/">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Cuphead</title>
    <style>
      body {
        background-color: black;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      #gameContainer {
        width: 100vw !important;
        height: 100vh !important;
      }
      canvas {
        width: 100% !important;
        height: 100% !important;
      }
      #loading-text {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: grid;
        place-items: center;
        color: #21170f;
        background:
          radial-gradient(circle at center, rgba(255,255,255,.55) 0 5%, transparent 6%),
          repeating-radial-gradient(circle at center, #f7d86d 0 14px, #e85f3a 15px 27px, #1c1c1c 28px 42px);
        font: 900 clamp(24px,5vw,64px) Georgia, serif;
        text-align: center;
        text-transform: uppercase;
        letter-spacing: 0;
        animation: iris 2.8s linear infinite;
      }
      #loading-text:before {
        content: "";
        width: 96px;
        height: 96px;
        border: 9px solid #21170f;
        border-top-color: #f7f0d0;
        border-radius: 50%;
        display: block;
        margin: 0 auto 22px;
        animation: reel .75s steps(8) infinite;
        box-shadow: 0 0 0 8px #f7f0d0;
      }
      @keyframes iris { to { background-position: 0 0, 84px 84px; } }
      @keyframes reel { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
<div id="loading-text">Cuphead<br><span>Winding the reel...</span></div>
    <div id="gameContainer"></div>
    <script src="Build/UnityLoader.js"></script>
    <script>
var loadingText = document.querySelector("#loading-text");
    let totalBytes = 0;
    let loadedBytes = 0;

    async function fetchWithProgress(url) {
      const response = await fetch(url);
      const reader = response.body.getReader();
      let chunks = [];
      let received = 0;
      while (true) {
        const {
          done,
          value
        } = await reader.read();
        if (done) break;
        received += value.length;
        loadedBytes += value.length;
        chunks.push(value);
        let mbDone = (loadedBytes / (1024 * 1024)).toFixed(2);
        let mbTotal = '2101.31';
        loadingText.innerHTML = `Cuphead<br><span>${mbDone} MB / ${mbTotal} MB</span>`;
      }
      let fullBuffer = new Uint8Array(received);
      let offset = 0;
      for (let chunk of chunks) {
        fullBuffer.set(chunk, offset);
        offset += chunk.length;
      }
      return fullBuffer.buffer;
    }

    async function mergeFiles(fileParts, cacheKey) {
      const cache = await caches.open("cuphead-cache");
      const cachedResponse = await cache.match(cacheKey);
      if (cachedResponse) {
        const blob = await cachedResponse.blob();
        return URL.createObjectURL(blob);
      }
      const buffers = await Promise.all(
        fileParts.map(part => fetchWithProgress(part))
      );
      const mergedBlob = new Blob(buffers);
      const response = new Response(mergedBlob);
      await cache.put(cacheKey, response);
      return URL.createObjectURL(mergedBlob);
    }

    function getParts(file, start, end) {
      let parts = [];
      for (let i = start; i <= end; i++) {
        parts.push(file + ".part" + i);
      }
      return parts;
    }
    (async () => {
      const [dataUrl, wasmUrl, asmUrl] = await Promise.all([
        mergeFiles(getParts("Build/CupheadPort.data.unityweb", 1, 103), "CupheadPort.data.unityweb"),
        mergeFiles(getParts("Build/CupheadPort.wasm.code.unityweb", 1, 2), "CupheadPort.wasm.code.unityweb"),
        mergeFiles(getParts("Build/CupheadPort.asm.code.unityweb", 1, 3), "CupheadPort.asm.code.unityweb"),
      ]);

      const originalOpen = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function (method, url, ...rest) {
          if (url.includes("CupheadPort.data.unityweb")) {
              url = dataUrl;
          } else if (url.includes("CupheadPort.wasm.code.unityweb")) {
              url = wasmUrl;
          } else if (url.includes("CupheadPort.asm.code.unityweb")) {
              url = asmUrl;
          }
          return originalOpen.call(this, method, url, ...rest);
      };
      Object.defineProperty(window, "alert", { value: function (message) {
        loadingText.innerHTML = `Cuphead<br><span>${String(message || "Load failed")}</span>`;
        console.error(message);
      } });
      var unityInstance = UnityLoader.instantiate("gameContainer", "Build/CupheadPort.json");
      loadingText.remove();
    })();
    </script>
  </body>
</html>
