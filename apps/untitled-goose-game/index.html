<!DOCTYPE html>
<html lang="en-us">
  <head>
    <base href="https://cdn.jsdelivr.net/gh/web-ports/untitled-goose-game@main/">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | Untitled Goose Game</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      body{margin:0;background:#9fd7ef;overflow:hidden}
      #loading-text{position:fixed;inset:0;z-index:50;display:grid;place-items:center;color:#142018;font:800 clamp(26px,5vw,58px) Arial,sans-serif;text-align:center;background:linear-gradient(#9fd7ef 0 58%,#83b969 59% 100%)}
      #loading-text:before{content:"";position:absolute;bottom:19%;left:12%;width:76%;height:18%;background:repeating-linear-gradient(90deg,#f7f0cf 0 34px,#e7deaf 35px 62px);border:4px solid #142018;border-radius:50%;animation:waddle 1.2s ease-in-out infinite}
      #loading-text:after{content:"";position:absolute;bottom:35%;left:50%;width:62px;height:48px;background:white;border:4px solid #142018;border-radius:50% 50% 44% 44%;box-shadow:38px -12px 0 -16px #f18c2e;animation:goose 1.2s ease-in-out infinite}
      #loading-text span{display:block;margin-top:10px;font-size:16px;font-weight:700}
      #unity-logo{display:none!important}
      @keyframes goose{50%{transform:translateX(18px) rotate(3deg)}}
      @keyframes waddle{50%{transform:translateX(-10px)}}
    </style>
  </head>
  <body>
    <div id="loading-text">Untitled Goose Game<span>Preparing trouble...</span></div>
    <div id="unity-container">
      <canvas id="unity-canvas" width=960 height=540 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
    </div>
    <script>
      var loadingText = document.querySelector("#loading-text");
    let totalBytes = 0;
    let loadedBytes = 0;

    async function fetchWithProgress(url) {
      const response = await fetch(url);
      const reader = response.body.getReader();
      let chunks = [];
      let received = 0;
      while (true) {
        const {
          done,
          value
        } = await reader.read();
        if (done) break;
        received += value.length;
        loadedBytes += value.length;
        chunks.push(value);
        let mbDone = (loadedBytes / (1024 * 1024)).toFixed(2);
        let mbTotal = '95.69';
        loadingText.innerHTML = `Untitled Goose Game<span>${mbDone} MB / ${mbTotal} MB</span>`;
      }
      let fullBuffer = new Uint8Array(received);
      let offset = 0;
      for (let chunk of chunks) {
        fullBuffer.set(chunk, offset);
        offset += chunk.length;
      }
      return fullBuffer.buffer;
    }

    async function mergeFiles(fileParts, cacheKey) {
      const buffers = await Promise.all(
        fileParts.map(part => fetchWithProgress(part))
      );
      const mergedBlob = new Blob(buffers);
      return URL.createObjectURL(mergedBlob);
    }

    function getParts(file, start, end) {
      let parts = [];
      for (let i = start; i <= end; i++) {
        parts.push(file + ".part" + i);
      }
      return parts;
    }
    (async () => {
      const [dataUrl, wasmUrl] = await Promise.all([
        mergeFiles(getParts("Build/Untitled Goose Game.data", 1, 4), "Untitled Goose Game.data"),
        mergeFiles(getParts("Build/Untitled Goose Game.wasm", 1, 2), "Untitled Goose Game.wasm"),
      ]);

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Untitled Goose Game.loader.js";
      var config = {
        arguments: [],
        dataUrl: dataUrl,
        frameworkUrl: buildUrl + "/Untitled Goose Game.framework.js",
        codeUrl: wasmUrl,
        streamingAssetsUrl: "StreamingAssets",
        companyName: "",
        productName: "Untitled Goose Game",
        productVersion: "0.2",
        showBanner: unityShowBanner,
      };

      // By default Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
      }


      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
          loadingText.remove();
        }).catch((message) => {
          loadingText.innerHTML = `Untitled Goose Game<span>${String(message || "Load failed")}</span>`;
        });
      };
      document.body.appendChild(script);
    })();
    </script>
  </body>
</html>
