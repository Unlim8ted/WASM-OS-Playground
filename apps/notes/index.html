<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Notes</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#202124;color:#e8eaed;font:14px Arial,sans-serif}body{display:grid;grid-template-columns:210px 1fr}.side{background:#292a2d;border-right:1px solid #3c4043;padding:14px}.brand{font-size:18px;font-weight:600;margin:4px 6px 15px}.new{width:100%;height:38px;border:0;border-radius:19px;background:#8ab4f8;color:#10284f;font-weight:600}.list{margin-top:14px}.item{padding:10px;border-radius:10px;color:#bdc1c6}.item.sel{background:#3c4043;color:white}.main{display:flex;flex-direction:column;padding:22px}.title{font-size:22px;border:0;outline:0;background:transparent;color:white;margin-bottom:12px}.note{flex:1;resize:none;border:0;outline:0;background:transparent;color:#e8eaed;font:15px/1.65 Arial}.save{font-size:12px;color:#9aa0a6;text-align:right;padding-top:8px}.modalback{display:none;position:fixed;inset:0;background:#0008;place-items:center}.modalback.show{display:grid}.modal{width:min(360px,calc(100vw - 36px));background:#292a2d;border:1px solid #3c4043;border-radius:8px;padding:18px;box-shadow:0 18px 60px #0008}.modal h2{margin:0 0 8px;font-size:18px}.modal p{margin:0 0 18px;color:#bdc1c6}.modalactions{display:flex;justify-content:flex-end;gap:8px}.modal button{height:34px;border:1px solid #3c4043;border-radius:6px;background:#303134;color:#e8eaed;padding:0 14px}.modal .primary{background:#8ab4f8;color:#10284f;border-color:#8ab4f8}
</style>
</head>
<body>
<aside class="side"><div class="brand">Notes</div><button class="new" id="new">+ New note</button><div class="list"><div class="item sel">Current note</div></div></aside>
<main class="main"><input class="title" id="title" value="Untitled note"><textarea class="note" id="note" placeholder="Start typing..."></textarea><div class="save" id="save">Saved</div></main>
<div class="modalback" id="modalback"><div class="modal"><h2>Clear note?</h2><p>Start a new blank note and replace the current text?</p><div class="modalactions"><button id="modalCancel">Cancel</button><button class="primary" id="modalOK">Clear</button></div></div></div>
<script>
const K='unlim8ted-notes-v1';let d={title:'Untitled note',text:''};try{d=JSON.parse(localStorage.getItem(K))||d}catch{};title.value=d.title;note.value=d.text;let t;function save(){d={title:title.value||'Untitled note',text:note.value};localStorage.setItem(K,JSON.stringify(d));document.getElementById('save').textContent='Saved'}function askClear(){return new Promise(r=>{modalback.classList.add('show');modalOK.onclick=()=>{modalback.classList.remove('show');r(true)};modalCancel.onclick=()=>{modalback.classList.remove('show');r(false)}})}[title,note].forEach(x=>x.addEventListener('input',()=>{document.getElementById('save').textContent='Saving...';clearTimeout(t);t=setTimeout(save,250)}));document.getElementById('new').onclick=async()=>{if(await askClear()){title.value='Untitled note';note.value='';save();note.focus()}};
</script>
</body>
</html>
